[project]
name = "destrucyion-telegram-bot"
version = "0.1.0"
description = "Multi-tenant Telegram media preservation service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "telethon>=1.39.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-telegram-bot>=21.9",
    "redis[hiredis]>=5.2.0",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
# Full production extras (asyncpg, redis, uvicorn[standard]/watchfiles)
# Requires pre-built wheels or build tools (Rust/clang)
full = [
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
]
# Development tools (ruff, mypy, pytest)
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "fakeredis>=2.26.0",
]
# SQLite async driver — lightweight fallback for local/Termux dev (no Postgres needed)
sqlite = [
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
