[project]
name = "destrucyion-telegram-bot"
version = "0.1.0"
description = "Multi-tenant Telegram media preservation service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "telethon>=1.39.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-telegram-bot[job-queue]>=21.9",
    "redis[hiredis]>=5.2.0",
    "slowapi>=0.1.10",
    "qrcode>=8.0",
    "Pillow>=10.0.0",
    "asyncpg>=0.31.0",
]

[project.optional-dependencies]
# Full production extras (asyncpg, redis, uvicorn[standard]/watchfiles)
# Requires pre-built wheels or build tools (Rust/clang)
full = [
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
]
# Development tools (ruff, mypy, pytest)
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "fakeredis>=2.26.0",
]
# SQLite async driver — lightweight fallback for local/Termux dev (no Postgres needed)
sqlite = [
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
destrucyion-telegram-bot = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic==1.19.2",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "cffi==2.1.1 ; platform_python_implementation != 'PyPy'",
    "click==8.5.0",
    "cryptography==50.0.1",
    "destrucyion-telegram-bot",
    "fakeredis>=2.38.0",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "hiredis==3.4.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.19",
    "mako==1.4.1",
    "markupsafe==3.0.3",
    "pyaes==1.6.1",
    "pyasn1==0.6.4",
    "pycparser==3.0 ; implementation_name != 'PyPy' and platform_python_implementation != 'PyPy'",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv==1.2.3",
    "python-telegram-bot==22.8",
    "redis==8.1.0",
    "rsa==4.9.1",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "structlog==26.1.0",
    "telethon==1.44.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.52.4",
]
